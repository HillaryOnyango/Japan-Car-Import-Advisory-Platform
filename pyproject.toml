[project]
name = "japan-car-import-advisory-platform"
version = "0.1.0"
description = "Data engineering and machine learning platform for comparing Japan car import costs with Kenyan local market prices."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "joblib>=1.4.2",
    "lxml>=5.3.0",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "playwright>=1.49.0",
    "plotly>=5.24.1",
    "psycopg2-binary>=2.9.10",
    "psycopg[binary]>=3.2.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "scikit-learn>=1.5.2",
    "sqlalchemy>=1.4.54,<2.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
orchestration = [
    "apache-airflow>=2.10.3,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.8.0",
]


[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = ["app", "calculator", "config", "etl", "ml", "scrapers", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
